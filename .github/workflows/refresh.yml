name: Refresh

on:
  # GitHub runs scheduled workflows late or skips them, so this is only a fallback.
  # Minute 4 of each ten avoids the busy top of the hour. The main trigger is the
  # source-updated event that the source repository sends on each push.
  schedule:
    - cron: "4-59/10 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [source-updated]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # One mirror snapshot per day; later runs that day fetch only what changed since.
      - name: Pick the mirror cache key
        id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore the source mirror
        uses: actions/cache@v6
        with:
          path: source.git
          key: mirror-${{ steps.day.outputs.day }}
          restore-keys: mirror-

      - name: Fetch the source repository
        run: |
          if [ -d source.git ]; then
            git -C source.git fetch --prune --quiet origin
          else
            git clone --mirror --quiet "$(jq -r .repo config.json)" source.git
          fi

      - name: Build the site
        run: |
          python3 scripts/extract.py source.git config.json data.json
          python3 scripts/build.py data.json site/template.html _site --live

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5

      # GitHub turns off scheduled workflows in a public repo after 60 days without commits.
      - name: Keep the schedule alive
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep the scheduled refresh alive"
            git push
          fi
